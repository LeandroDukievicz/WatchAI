name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A suíte roda headless (Textual em modo de teste) e não toca áudio:
      # tests/conftest.py neutraliza o player para toda a suíte.
      - name: Testes
        run: pytest

      - name: Lint (imports mortos)
        run: pyflakes src tests main.py
