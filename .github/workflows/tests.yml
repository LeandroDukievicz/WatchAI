name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # A detecção trata Windows e macOS de forma diferente (tty que não
        # existe, cwd que pode ser negado): a suíte precisa rodar lá também.
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A suíte roda headless (Textual em modo de teste) e não toca áudio:
      # tests/conftest.py neutraliza o player para toda a suíte.
      - name: Testes
        run: pytest

      # Um SVG por tela e por sistema: teste verde não revela fonte quebrada,
      # modal cortado ou diferença do renderizador do Windows/macOS.
      - name: Exportar todas as telas
        if: matrix.python-version == '3.13'
        run: python scripts/ci_screenshots.py artifacts/screens

      - name: Guardar capturas para inspeção
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/screens/*.svg
          if-no-files-found: error

      - name: Lint (imports mortos)
        run: pyflakes src tests main.py

  # A promessa "roda igual nos três" só vale verificada: instala pelo pipx e
  # confere que o comando existe e responde, em Linux, macOS e Windows.
  pipx:
    name: pipx (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar com pipx
        shell: bash
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          pipx list

      - name: O comando roda
        shell: bash
        run: pipx run --spec . watchai --version

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Instalar, conferir tipos e empacotar
        working-directory: vscode-extension
        run: |
          npm ci
          npm run check
          npm run package

      - name: Guardar VSIX instalável
        uses: actions/upload-artifact@v4
        with:
          name: watchai-vscode-extension
          path: vscode-extension/watchai.vsix
          if-no-files-found: error
