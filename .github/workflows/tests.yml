name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # A detecção trata Windows e macOS de forma diferente (tty que não
        # existe, cwd que pode ser negado): a suíte precisa rodar lá também.
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A suíte roda headless (Textual em modo de teste) e não toca áudio:
      # tests/conftest.py neutraliza o player para toda a suíte.
      - name: Testes
        run: pytest

      - name: Lint (imports mortos)
        run: pyflakes src tests main.py

  # A promessa "roda igual nos três" só vale verificada: instala pelo pipx e
  # confere que o comando existe e responde, em Linux, macOS e Windows.
  pipx:
    name: pipx (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar com pipx
        shell: bash
        run: |
          python -m pip install --upgrade pip pipx
          pipx install .
          pipx list

      - name: O comando roda
        shell: bash
        run: pipx run --spec . watchai --version
