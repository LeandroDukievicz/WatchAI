name: snap

# Constrói o snap e **prova que ele roda confinado**. Essa segunda parte é o
# que importa: um snap strict quebra de um jeito que o build não vê — o
# `HOME` lá dentro é a pasta privada do pacote, e um app que lê o disco do
# usuário passa a não achar nada. O teste abaixo liga as interfaces como quem
# instala vai ligar, e confere que o binário sobe.
#
# Não publica na loja: isso é um passo com credencial, feito à parte.

on:
  push:
    branches: [main]
    paths:
      - "snap/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/snap.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build

      - name: Instalar
        run: sudo snap install --dangerous "${{ steps.build.outputs.snap }}"

      - name: Ligar as interfaces de conexão manual
        run: |
          for plug in system-observe dot-claude dot-codex dot-opencode; do
            sudo snap connect "watchai:$plug"
          done
          snap connections watchai

      - name: Rodar
        run: watchai --version

      - name: O confinamento é mesmo strict
        # `--classic` num yaml strict passaria no build e só apareceria na
        # revisão da loja; aqui aparece agora.
        run: |
          modo=$(snap list watchai | awk 'NR==2 {print $6}')
          echo "confinamento: ${modo:-(vazio = strict)}"
          test "$modo" != "classic"

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
