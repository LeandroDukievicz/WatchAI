name: watchai
title: WatchAI
base: core24
adopt-info: watchai
summary: Monitore sessões de agentes de IA no terminal
description: |
  WatchAI reúne as sessões de Claude Code, Codex e outros agentes num painel
  no terminal, com um semáforo por sessão: verde quando terminou, âmbar
  enquanto trabalha, vermelho quando quebrou.

  A detecção é local e sem integração: varredura da tabela de processos mais
  leitura dos diários que os próprios agentes já gravam no seu disco. Não há
  API, hook, credencial nem configuração de agente envolvida.

  Depois de instalar, ligue as duas conexões manuais:

    snap connect watchai:system-observe
    snap connect watchai:dot-claude
    snap connect watchai:dot-codex

  Sem a primeira o painel não enxerga as sessões; sem as outras ele vê os
  processos mas não o que cada agente está fazendo.

grade: stable
license: MIT
website: https://leandrodukievicz.github.io/WatchAI/
source-code: https://github.com/LeandroDukievicz/WatchAI
issues: https://github.com/LeandroDukievicz/WatchAI/issues

# Por que **strict**, e não classic.
#
# A versão anterior deste arquivo pedia `classic` com a justificativa de que
# notificação e `⇧A` não atravessam o sandbox. Metade disso estava errado: o
# `notify-send` atravessa, com `libnotify-bin` em stage-packages e a interface
# `desktop`. O que de fato não atravessa é o `⇧A` — ele fala com o shell da
# sessão gráfica por D-Bus, e isso o `desktop` não concede. É um preço de uma
# tecla, e o caminho de reserva (o sino da tty e a marcação de título) continua
# valendo.
#
# E `classic` provavelmente seria **recusado**: a lista de categorias aceitas é
# compiladores, IDEs, linguagens, emuladores de terminal, agentes de nuvem e
# ferramentas de workspace, e um monitor não é nenhuma delas.
#
# O bloqueio real do strict era outro, e caiu: a `system-observe` não libera
# `cwd` de outros processos, então `proc.cwd()` devolve `None` aqui dentro. O
# WatchAI deixou de depender disso — o diretório de cada sessão vem do diário
# do próprio agente.
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  watchai:
    command: bin/watchai
    plugs:
      - system-observe        # a tabela de processos: é disto que sai a detecção
      - audio-playback        # o bip quando uma sessão fica pronta
      - desktop               # notify-send, pela org.freedesktop.Notifications
      - dot-claude
      - dot-codex
      - dot-opencode

# Leitura, e só leitura, dos diários que os agentes já gravam. É o mesmo que um
# `tail` nesses arquivos: nenhum deles guarda credencial — a do Claude Code fica
# em `~/.claude/.credentials.json`, que **não** está listado aqui, e a do codex
# em `~/.codex/auth.json`, que o leitor nunca abre (ele só varre
# `sessions/**/rollout-*.jsonl`).
plugs:
  dot-claude:
    interface: personal-files
    read:
      - $HOME/.claude/projects
      - $HOME/.claude/settings.json
      - $HOME/.claude/settings.local.json
  dot-codex:
    interface: personal-files
    read:
      - $HOME/.codex/sessions
  dot-opencode:
    interface: personal-files
    read:
      - $HOME/.local/share/opencode/storage

parts:
  watchai:
    plugin: python
    source: .
    stage-packages:
      # Nada disto existe na base: confinado, o `shutil.which` não enxerga o
      # /usr/bin do host. Sem estes três o app roda calado — a notificação
      # some e o bip cai no sino da tty, que é o plano C e não o plano A.
      - libnotify-bin           # notify-send, autorizado pela interface `desktop`
      - pulseaudio-utils        # paplay, que toca pela `audio-playback`
      - sound-theme-freedesktop # os .oga que o tocador precisa ter o que tocar
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
