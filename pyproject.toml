[project]
name = "watchai"
version = "1.2.0"
description = "WatchAI — monitor de sessões de IA no terminal: detecta Claude Code, Codex e outros agentes por processo e diário local"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Leandro Dukievicz" }]
keywords = ["tui", "terminal", "textual", "monitor", "ai", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
]
dependencies = ["textual>=1.0,<9", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.urls]
Homepage = "https://github.com/LeandroDukievicz/WatchAI"
Repository = "https://github.com/LeandroDukievicz/WatchAI"

[project.scripts]
watchai = "watchai.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["watchai*"]

[tool.setuptools.package-data]
watchai = ["styles/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
